services:
  - type: web
    name: mythora-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: storyweave
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
